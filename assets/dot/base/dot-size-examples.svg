<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" width="420" height="120" role="img" aria-label="Dot size examples 16 to 64 px">
  <g>
    <!-- 16 -->
    <g transform="translate(30 60)"><circle r="8" fill="#F042BE"/><ellipse cx="-1.5" cy="-0.5" rx="2" ry="2.6" fill="#fff"/><ellipse cx="3" cy="-1" rx="2" ry="2.6" fill="#fff"/><circle cx="-0.5" cy="0" r="1" fill="#0F1A3C"/><circle cx="4" cy="-0.5" r="1" fill="#0F1A3C"/></g>
    <text x="30" y="96" text-anchor="middle" font-family="Arial" font-size="10" fill="#0F1A3C">16 px</text>
    <!-- 24 -->
    <g transform="translate(96 60)"><circle r="12" fill="#F042BE"/><ellipse cx="-2" cy="-1" rx="3" ry="4" fill="#fff"/><ellipse cx="4.5" cy="-1.5" rx="3" ry="4" fill="#fff"/><circle cx="-0.6" cy="0" r="1.6" fill="#0F1A3C"/><circle cx="5.8" cy="-0.5" r="1.6" fill="#0F1A3C"/></g>
    <text x="96" y="96" text-anchor="middle" font-family="Arial" font-size="10" fill="#0F1A3C">24 px</text>
    <!-- 32 -->
    <g transform="translate(174 60)"><circle r="16" fill="#F042BE"/><ellipse cx="-3" cy="-1.5" rx="4" ry="5.5" fill="#fff"/><ellipse cx="6" cy="-2" rx="4" ry="5.5" fill="#fff"/><circle cx="-1" cy="0" r="2.1" fill="#0F1A3C"/><circle cx="8" cy="-0.6" r="2.1" fill="#0F1A3C"/></g>
    <text x="174" y="96" text-anchor="middle" font-family="Arial" font-size="10" fill="#0F1A3C">32 px</text>
    <!-- 48 -->
    <g transform="translate(268 60)"><circle r="24" fill="#F042BE"/><ellipse cx="-4.5" cy="-2" rx="6" ry="8" fill="#fff"/><ellipse cx="9" cy="-3" rx="6" ry="8" fill="#fff"/><circle cx="-1.5" cy="0" r="3.1" fill="#0F1A3C"/><circle cx="12" cy="-1" r="3.1" fill="#0F1A3C"/></g>
    <text x="268" y="96" text-anchor="middle" font-family="Arial" font-size="10" fill="#0F1A3C">48 px</text>
    <!-- 64 -->
    <g transform="translate(376 60)"><circle r="32" fill="#F042BE"/><ellipse cx="-6" cy="-3" rx="8" ry="10.5" fill="#fff"/><ellipse cx="12" cy="-4" rx="8" ry="10.5" fill="#fff"/><circle cx="-2" cy="0" r="4.1" fill="#0F1A3C"/><circle cx="16" cy="-1.5" r="4.1" fill="#0F1A3C"/></g>
    <text x="376" y="96" text-anchor="middle" font-family="Arial" font-size="10" fill="#0F1A3C">64 px</text>
  </g>
</svg>
