  <!-- motion arcs -->
  <g fill="none" stroke="#0F1A3C" stroke-width="3.5" stroke-linecap="round" opacity="0.45">
    <path d="M40 70 q10 -10 20 0"/>
    <path d="M32 82 q12 -12 24 0"/>
    <path d="M144 70 q-10 -10 -20 0"/>
    <path d="M152 82 q-12 -12 -24 0"/>
  </g>
  <circle cx="100" cy="86" r="62" fill="#F042BE"/>
  <ellipse cx="86" cy="82" rx="14" ry="19" fill="#FFFFFF"/>
  <ellipse cx="120" cy="80" rx="14" ry="19" fill="#FFFFFF"/>
  <circle cx="92" cy="86" r="7.5" fill="#0F1A3C"/>
  <circle cx="126" cy="84" r="7.5" fill="#0F1A3C"/>
  <circle cx="94.5" cy="82.5" r="2.2" fill="#FFFFFF"/>
  <circle cx="128.5" cy="80.5" r="2.2" fill="#FFFFFF"/>
</svg>
