<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 170" width="240" height="170" role="img" aria-label="Dot is always nearby, peeking beside a window">
  <!-- app window -->
  <rect x="18" y="26" width="120" height="120" rx="12" fill="#FFFFFF" stroke="#0F1A3C" stroke-width="2" opacity="0.9"/>
  <rect x="18" y="26" width="120" height="24" rx="12" fill="#E9ECF2"/>
  <rect x="18" y="44" width="120" height="6" fill="#E9ECF2"/>
  <!-- Dot peeking at the right edge -->
  <ellipse cx="172" cy="138" rx="32" ry="6" fill="#0F1A3C" opacity="0.08"/>
  <clipPath id="nearbyClip"><rect x="138" y="0" width="120" height="170"/></clipPath>
  <g clip-path="url(#nearbyClip)">
    <circle cx="168" cy="96" r="46" fill="#F042BE"/>
    <ellipse cx="158" cy="92" rx="11" ry="15" fill="#FFFFFF"/>
    <ellipse cx="184" cy="90" rx="11" ry="15" fill="#FFFFFF"/>
    <circle cx="152" cy="96" r="5.5" fill="#0F1A3C"/>
    <circle cx="178" cy="94" r="5.5" fill="#0F1A3C"/>
    <circle cx="154" cy="93" r="1.7" fill="#FFFFFF"/>
    <circle cx="180" cy="91" r="1.7" fill="#FFFFFF"/>
  </g>
  <rect x="136" y="30" width="5" height="116" rx="2.5" fill="#0F1A3C" opacity="0.65"/>
</svg>
