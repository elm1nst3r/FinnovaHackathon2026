<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AI Guard</title>
    <style>
      body {
        width: 280px;
        margin: 0;
        padding: 14px;
        font: 13px/1.45 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #16181d;
      }
      h1 { font-size: 14px; margin: 0 0 8px; }
      label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: #646b78; margin-top: 10px; }
      select, a.button { font: inherit; width: 100%; padding: 5px 7px; border: 1px solid #e2e5ea; border-radius: 6px; background: #fff; }
      a.button { display: block; text-align: center; text-decoration: none; color: #1f4ed8; margin-top: 12px; }
      .muted { color: #646b78; font-size: 11px; margin-top: 8px; }
      .warn { color: #9a6100; font-size: 11px; margin-top: 8px; }
    </style>
  </head>
  <body>
    <h1>AI Guard</h1>
    <label for="identity">Demo identity</label>
    <select id="identity">
      <option value="u-anna">Anna Berger</option>
      <option value="u-luca">Luca Moretti</option>
      <option value="u-sara">Sara Keller · governance</option>
    </select>
    <p class="muted" id="version"></p>
    <p class="warn" id="staleness"></p>
    <a class="button" href="http://127.0.0.1:8787/" target="_blank" rel="noreferrer">Open the cockpit</a>
    <script type="module" src="popup.js"></script>
  </body>
</html>
